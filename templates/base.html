<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CC TV{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col">
    <!-- Navigation -->
    <nav class="bg-gray-900 border-b border-gray-800 px-4 py-3 sticky top-0 z-50">
        <div class="max-w-screen-2xl mx-auto flex items-center justify-between">
            <a href="/" class="flex items-center gap-3 text-xl font-bold text-white hover:text-blue-400 transition">
                <span class="text-2xl">🎥</span>
                <span>CC TV</span>
            </a>
            <div class="flex items-center gap-1">
                <a href="/" class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    <i class="fas fa-tv mr-1"></i> Live
                </a>
                <a href="/events" class="nav-link {% if request.endpoint == 'events_page' %}active{% endif %}">
                    <i class="fas fa-clock mr-1"></i> Events
                </a>
                <a href="/settings" class="nav-link {% if request.endpoint == 'settings_page' %}active{% endif %}">
                    <i class="fas fa-cog mr-1"></i> Settings
                </a>
            </div>
            <div class="flex items-center gap-3">
                <span id="connection-badge" class="badge badge-offline">
                    <i class="fas fa-circle text-xs mr-1"></i>
                    <span id="connection-text">Connecting</span>
                </span>
                <button id="notification-bell" class="relative text-gray-400 hover:text-white transition p-2">
                    <i class="fas fa-bell text-lg"></i>
                    <span id="notification-count" class="notification-badge hidden">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 flex flex-col gap-2 max-w-sm"></div>

    <!-- Main Content -->
    <main class="flex-1 max-w-screen-2xl mx-auto w-full px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 border-t border-gray-800 px-4 py-3 text-center text-sm text-gray-500">
        CC TV — AI-Powered Surveillance System
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
